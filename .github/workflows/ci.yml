# ═══════════════════════════════════════════════════════════════
#  FinTrust FD Manager — CI Pipeline
# ═══════════════════════════════════════════════════════════════
#  Triggers: Push to main/develop, Pull requests to main/develop
# ═══════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20"

jobs:
  # ───────────────────────────────────────────────────────────
  #  Job 1: Build & Test Backend
  # ───────────────────────────────────────────────────────────
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Backend/FinTrustFDManager.slnx

      - name: Build
        run: dotnet build Backend/FinTrustFDManager.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Backend/FinTrustFDManager.slnx --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=backend-tests.trx"

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: "**/*.trx"

  # ───────────────────────────────────────────────────────────
  #  Job 2: Build & Test Frontend
  # ───────────────────────────────────────────────────────────
  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: Frontend/FinTrustFDManager.UI/package-lock.json

      - name: Install dependencies
        working-directory: Frontend/FinTrustFDManager.UI
        run: npm ci

      - name: Build
        working-directory: Frontend/FinTrustFDManager.UI
        run: npm run build -- --configuration=production

  # ───────────────────────────────────────────────────────────
  #  Job 3: Docker Build (only on push to main/develop)
  # ───────────────────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend/FinTrustFDManager.UI
          file: ./Frontend/FinTrustFDManager.UI/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/ui:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
