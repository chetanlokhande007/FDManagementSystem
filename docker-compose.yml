# ═══════════════════════════════════════════════════════════════
#  FinTrust FD Manager — Full Stack
# ═══════════════════════════════════════════════════════════════
#  Usage:
#    Development:  docker compose up --build
#    Production:   docker compose -f docker-compose.yml up -d --build
#    Stop:         docker compose down
#    Reset DB:     docker compose down -v && docker compose up --build
# ═══════════════════════════════════════════════════════════════

services:
  # ── PostgreSQL Database ──
  database:
    image: postgres:16-alpine
    container_name: fintrust-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-FDManagementDB}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-FDManagementDB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Backend API (.NET 8) ──
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: fintrust-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Connection string uses the DB_PASSWORD env var
      ConnectionStrings__DefaultConnection: "Host=database;Port=5432;Database=${DB_NAME:-FDManagementDB};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      Jwt__Key: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-FinTrustFDManager}
      Jwt__Audience: ${JWT_AUDIENCE:-FinTrustFDManagerUsers}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080

  # ── Frontend (Angular + Nginx) ──
  frontend:
    build:
      context: ./Frontend/FinTrustFDManager.UI
      dockerfile: Dockerfile
    container_name: fintrust-ui
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
