<aside class="sidebar" [class.open]="isOpen">

  <!-- Logo -->
  <div class="logo-section">

    <div class="logo-icon">
      <svg width="40" height="44" viewBox="0 0 40 44" fill="none" xmlns="http://www.w3.org/2000/svg">

        <path d="M20 40C20 40 5 32 5 14V6L20 2V40Z" fill="#2563EB" />

        <path d="M20 40C20 40 35 32 35 14V6L20 2V40Z" fill="#172e68" />

        <path d="M20 2L5 6V14C5 32 20 40 20 40C20 40 35 32 35 14V6L20 2Z" stroke="#60A5FA" stroke-width="2" />

        <path d="M14 12h11v3.5h-7.5v4h4.5v3.5h-4.5v7h-3.5z" fill="white" />

        <path d="M22 19.5h3.5l-1.5 3.5h-3.5z" fill="#F59E0B" />

      </svg>
    </div>

    <div class="logo-text">
      <h2>
        <span class="text-blue">Fin</span>
        <span class="text-white">Trust</span>
      </h2>

      <span class="sub-text">FD MANAGER</span>
    </div>

    <button class="close-mobile-btn" (click)="closeSidebar.emit()">

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">

        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>

      </svg>

    </button>

  </div>


  <!-- Navigation -->
  <nav class="nav-menu">

    <!-- =============================== -->
    <!-- ADMIN SIDEBAR -->
    <!-- =============================== -->
    <ng-container *ngIf="isAdmin">

      <!-- Dashboard -->
      <a routerLink="/admin/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Dashboard
      </a>

      <!-- Master Data (expandable) -->
      <div class="nav-section">
        <div class="nav-section-header" (click)="toggleAdminMasterData()">
          <small>MASTER DATA</small>
          <svg class="arrow" [class.rotate]="isAdminMasterDataOpen" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
        <div class="nav-items" *ngIf="isAdminMasterDataOpen">
          <a routerLink="/entities" routerLinkActive="active" class="nav-item sub-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
              <path d="M9 22v-4h6v4"></path>
              <path d="M8 6h.01"></path>
              <path d="M16 6h.01"></path>
              <path d="M12 6h.01"></path>
              <path d="M12 10h.01"></path>
              <path d="M12 14h.01"></path>
            </svg>
            Entities
          </a>
          <a routerLink="/counterparties" routerLinkActive="active" class="nav-item sub-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
            Counterparties
          </a>
          <a routerLink="/countries" routerLinkActive="active" class="nav-item sub-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            Countries
          </a>
          <a routerLink="/currencies" routerLinkActive="active" class="nav-item sub-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="1" x2="12" y2="23"></line>
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
            Currencies
          </a>
          <a routerLink="/benchmarks" routerLinkActive="active" class="nav-item sub-item">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            Benchmarks
          </a>
        </div>
      </div>

      <!-- FD Creation -->
      <a routerLink="/fd-detail" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="15" y2="15"></line>
        </svg>
        FD Creation
      </a>

      <!-- Reset Configuration -->
      <a routerLink="/admin/reset-configuration" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        Reset Configuration
      </a>

      <!-- Cash Flow Generation -->
      <a routerLink="/admin/cash-flow-generation" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="1" x2="12" y2="23"></line>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
        </svg>
        Cash Flow Generation
      </a>

      <!-- FD Approval -->
      <a routerLink="/admin/approvals" routerLinkActive="active" class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        FD Approval
      </a>

    </ng-container>

    <!-- =============================== -->
    <!-- APPROVER SIDEBAR -->
    <!-- =============================== -->
    <a *ngIf="isApprover" routerLink="/approver/dashboard" routerLinkActive="active" class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Approver Dashboard
    </a>

    <!-- =============================== -->
    <!-- CA SIDEBAR -->
    <!-- =============================== -->

    <!-- Dashboard (CA only) -->
    <a *ngIf="isCA" routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Dashboard
    </a>

    <!-- INVESTMENTS (CA only) -->
    <div class="nav-section" *ngIf="isCA">
      <div class="nav-section-header" (click)="toggleInvestments()">
        <small>INVESTMENTS</small>
        <svg class="arrow" [class.rotate]="isInvestmentsOpen" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <div class="nav-items" *ngIf="isInvestmentsOpen">
        <a routerLink="/fd" routerLinkActive="active" class="nav-item sub-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
          Fixed Deposit
        </a>
      </div>
    </div>

    <!-- MASTER DATA (CA only) -->
    <div class="nav-section" *ngIf="isCA">
      <div class="nav-section-header" (click)="toggleMasterData()">
        <small>MASTER DATA</small>
        <svg class="arrow" [class.rotate]="isMasterDataOpen" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
      <div class="nav-items" *ngIf="isMasterDataOpen">
        <a routerLink="/entities" routerLinkActive="active" class="nav-item sub-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2"></rect>
            <path d="M9 22v-4h6v4"></path>
            <path d="M8 6h.01"></path>
            <path d="M16 6h.01"></path>
            <path d="M12 6h.01"></path>
            <path d="M12 10h.01"></path>
            <path d="M12 14h.01"></path>
          </svg>
          Entities
        </a>
        <a routerLink="/counterparties" routerLinkActive="active" class="nav-item sub-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          Counterparties
        </a>
        <a routerLink="/countries" routerLinkActive="active" class="nav-item sub-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          Countries
        </a>
        <a routerLink="/currencies" routerLinkActive="active" class="nav-item sub-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
          Currencies
        </a>
        <a routerLink="/benchmarks" routerLinkActive="active" class="nav-item sub-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          Benchmarks
        </a>
      </div>
    </div>

  </nav>

  <!-- Logout -->
  <div class="logout-section">

    <a class="nav-item" (click)="logout()">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        <path d="M9 21H5a2 2 0 0 1-2-2V5
             a2 2 0 0 1 2-2h4">
        </path>

        <polyline points="16 17 21 12 16 7"></polyline>

        <line x1="21" y1="12" x2="9" y2="12">
        </line>

      </svg>

      Logout

    </a>

  </div>

</aside>
