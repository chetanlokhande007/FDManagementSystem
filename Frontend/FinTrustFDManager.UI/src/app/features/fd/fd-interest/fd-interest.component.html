<div class="interest-page">

  <!-- FORM VIEW -->
  <form [formGroup]="interestForm" (ngSubmit)="saveInterest()">
    <div class="form-grid">
      <div class="form-group">
        <label>Interest Rate Type</label>
        <select formControlName="interestRateType">
          <option value="FIXED">FIXED</option>
          <option value="FLOATING">FLOATING</option>
        </select>
      </div>
      <div class="form-group" *ngIf="interestForm.get('interestRateType')?.value === 'FIXED'">
        <label>Interest Rate (%)</label>
        <input type="number" formControlName="interestRate">
      </div>
      <div class="form-group" *ngIf="interestForm.get('interestRateType')?.value === 'FLOATING'">
        <label>Benchmark Name *</label>
        <select formControlName="benchmarkId">
          <option [ngValue]="null">Select Benchmark</option>
          <option *ngFor="let b of benchmarks" [ngValue]="b.benchmarkId">
            {{ b.benchmarkName }}
          </option>
        </select>
      </div>
      <div class="form-group" *ngIf="interestForm.get('interestRateType')?.value === 'FLOATING'">
        <label>Benchmark Rate (%)</label>
        <input type="number" formControlName="benchmarkRate" readonly>
      </div>
      <div class="form-group" *ngIf="interestForm.get('interestRateType')?.value === 'FLOATING'">
        <label>Margin (%)</label>
        <input type="number" formControlName="margin">
      </div>
      <div class="form-group" *ngIf="interestForm.get('interestRateType')?.value === 'FLOATING'">
        <label>Effective Rate (%)</label>
        <input type="number" [value]="effectiveRate" readonly>
      </div>
      <div class="form-group">
        <label>Interest Frequency</label>
        <select formControlName="interestFrequency">
          <option value="">Select Frequency</option>
          <option *ngFor="let freq of interestFrequencies" [value]="freq.frequencyName">
            {{ freq.frequencyName }}
          </option>
        </select>
      </div>
      <div class="form-group">
        <label>Compounding Frequency</label>
        <select formControlName="compoundingFrequency">
          <option value="">Select Frequency</option>
          <option *ngFor="let freq of compoundingFrequencies" [value]="freq.frequencyName">
            {{ freq.frequencyName }}
          </option>
        </select>
      </div>
      <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
        <input type="checkbox" formControlName="isCompounding" id="isCompounding">
        <label for="isCompounding" style="margin-bottom: 0;">Apply Compounding Interest</label>
      </div>
      <div class="form-group">
        <label>Calculation Basis</label>
        <select formControlName="calculationBasis">
          <option value="ACTUAL_365">ACTUAL_365</option>
          <option value="ACTUAL_360">ACTUAL_360</option>
        </select>
      </div>

      <div class="form-group">
        <label>Payment Convention</label>
        <input type="text" formControlName="paymentConvention">
      </div>

    </div>
    <div *ngIf="errorMessage" style="color: #dc2626; background-color: #fef2f2; border: 1px solid #fecaca; padding: 0.75rem; border-radius: 0.375rem; margin-bottom: 1rem; font-size: 0.875rem;">
      {{ errorMessage }}
    </div>
    <div class="form-actions">
      <button type="submit" class="save-btn" [disabled]="isSaving">
        {{ isEdit ? 'Update Interest' : 'Save Interest' }}
      </button>
    </div>
  </form>
</div>
