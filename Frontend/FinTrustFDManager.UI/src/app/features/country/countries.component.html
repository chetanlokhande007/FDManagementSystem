<div class="page-container">

  <div class="page-header">

    <div class="page-title">
      <h1>Countries</h1>
      <p>Manage countries</p>
    </div>

    <button class="btn-primary" (click)="addCountry()">
      + Add Country
    </button>

  </div>


  <div class="fintrust-card">

    <table class="fintrust-table">

      <thead>
        <tr>
          <th>ID</th>
          <th>Country Name</th>
          <th>Country Code</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>

        <!-- Backend data -->
        <tr *ngFor="let country of countries; let i = index">

          <td>{{ i + 1 }}</td>
          <td>{{ country.countryName }}</td>
          <td>{{ country.countryCode }}</td>

          <td>
            <span class="badge" [ngClass]="country.isActive ? 'badge-active' : 'badge-inactive'">
              {{ country.isActive ? 'Active' : 'Inactive' }}
            </span>
          </td>

          <td class="action-cell">
            <button class="action-btn edit" (click)="editCountry(country)">Edit</button>
            <button class="action-btn delete" (click)="deleteCountry(country.countryId)">Delete</button>
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>

<!-- Add/Edit form -->
<div class="form-overlay" *ngIf="showForm">

  <div class="form-card">

    <div class="form-header">

      <h3>
        {{ isEdit ? 'Edit Country' : 'Add Country' }}
      </h3>

      <button class="close-btn" (click)="closeForm()">
        ×
      </button>

    </div>


    <div class="form-body">

      <div class="form-group">

        <label>
          Country Name *
        </label>

        <input type="text" name="countryName" [(ngModel)]="country.countryName" placeholder="Enter country name">

      </div>


      <div class="form-group">

        <label>
          Country Code *
        </label>

        <input type="text" name="countryCode" [(ngModel)]="country.countryCode" maxlength="10"
          placeholder="Enter country code">

      </div>





      <div class="form-group">

        <label>
          Status
        </label>

        <select name="isActive" [ngModel]="country.isActive ? 'Active' : 'Inactive'"
          (ngModelChange)="country.isActive = ($event === 'Active')">

          <option value="Active">
            Active
          </option>

          <option value="Inactive">
            Inactive
          </option>

        </select>

      </div>

    </div>


    <div class="form-footer">

      <button class="cancel-btn" (click)="closeForm()">

        Cancel

      </button>

      <button class="save-btn" (click)="saveCountry()">

        {{ isEdit ? 'Update' : 'Save' }}

      </button>

    </div>

  </div>

</div>
