<div class="entity-page">

  <!-- Page Header -->
  <div class="page-header">

    <div>
      <h1>
        {{ isEditMode ? 'Edit Entity' : 'Register New Entity' }}
      </h1>

      <p>
        Enter the entity details below.
      </p>
    </div>

    <button
      type="button"
      class="back-btn"
      (click)="cancel()">

      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">

        <line
          x1="19"
          y1="12"
          x2="5"
          y2="12">
        </line>

        <polyline
          points="12 19 5 12 12 5">
        </polyline>

      </svg>

      Back

    </button>

  </div>


  <!-- Entity Form -->
  <form
    [formGroup]="entityForm"
    (ngSubmit)="onSubmit()">


    <!-- Row 1 -->
    <div class="form-row">


      <!-- Entity Code -->
      <div class="form-group">

        <label class="form-label">

          Entity Code

          <span class="required">*</span>

        </label>


        <input
          type="text"
          class="form-control"
          formControlName="entityCode"
          placeholder="e.g. ENT-001"

          [ngClass]="{
            'is-invalid':
              entityForm.get('entityCode')?.invalid &&
              entityForm.get('entityCode')?.touched
          }">


        <div
          class="invalid-feedback"

          *ngIf="
            entityForm.get('entityCode')?.invalid &&
            entityForm.get('entityCode')?.touched
          ">

          Entity Code is required (max 20 characters).

        </div>

      </div>


      <!-- Entity Name -->
      <div class="form-group">

        <label class="form-label">

          Entity Name

          <span class="required">*</span>

        </label>


        <input
          type="text"
          class="form-control"
          formControlName="entityName"
          placeholder="e.g. Acme Global Finance"

          [ngClass]="{
            'is-invalid':
              entityForm.get('entityName')?.invalid &&
              entityForm.get('entityName')?.touched
          }">


        <div
          class="invalid-feedback"

          *ngIf="
            entityForm.get('entityName')?.invalid &&
            entityForm.get('entityName')?.touched
          ">

          Entity Name is required (max 150 characters).

        </div>

      </div>

    </div>


    <!-- Country -->
    <div class="form-group">

      <label class="form-label">

        Jurisdiction (Country)

        <span class="required">*</span>

      </label>


      <select
        class="form-select"
        formControlName="countryId"

        [ngClass]="{
          'is-invalid':
            entityForm.get('countryId')?.invalid &&
            entityForm.get('countryId')?.touched
        }">

        <option
          value=""
          disabled>

          Select Jurisdiction

        </option>


        <!-- Only active countries are loaded in countries[] -->
        <option
          *ngFor="let country of countries"
          [value]="country.countryId">

          {{ country.countryName }}

        </option>

      </select>


      <div
        class="invalid-feedback"

        *ngIf="
          entityForm.get('countryId')?.invalid &&
          entityForm.get('countryId')?.touched
        ">

        Please specify the legal jurisdiction.

      </div>

    </div>


    <!-- Description -->
    <div class="form-group">

      <label class="form-label">

        Operational Remarks

      </label>


      <textarea
        class="form-control"
        formControlName="description"
        rows="4"
        placeholder="Additional details about the entity's operational scope...">
      </textarea>

    </div>


    <!-- Actions -->
    <div class="form-actions">

      <!-- Cancel -->
      <button
        type="button"
        class="btn-secondary"
        (click)="cancel()">

        Cancel

      </button>


      <!-- Save / Update -->
      <button
        type="submit"
        class="btn-primary"
        [disabled]="entityForm.invalid">


        <svg
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round">

          <path
            d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z">
          </path>

          <polyline
            points="17 21 17 13 7 13 7 21">
          </polyline>

          <polyline
            points="7 3 7 8 15 8">
          </polyline>

        </svg>


        {{ isEditMode ? 'Update Entity' : 'Save Entity' }}

      </button>

    </div>

  </form>

</div>
