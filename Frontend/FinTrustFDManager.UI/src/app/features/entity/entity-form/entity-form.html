<div class="page-container">
  <div class="card">
    <div class="card-header">
      <h4>{{ isEditMode ? 'Edit Entity Config' : 'Register New Entity' }}</h4>
      <button class="btn-secondary" (click)="cancel()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.25rem;"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back
      </button>
    </div>
    <div class="card-body">
      <form [formGroup]="entityForm" (ngSubmit)="onSubmit()">
        
        <div class="form-group">
          <label class="form-label">Entity Code <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="entityCode" placeholder="e.g. ENT-001"
                 [ngClass]="{'is-invalid': entityForm.get('entityCode')?.invalid && entityForm.get('entityCode')?.touched}">
          <div class="invalid-feedback" *ngIf="entityForm.get('entityCode')?.invalid && entityForm.get('entityCode')?.touched">
            Entity Code is required (max 20 chars).
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Entity Name <span class="text-danger">*</span></label>
          <input type="text" class="form-control" formControlName="entityName" placeholder="e.g. Acme Global Finance"
                 [ngClass]="{'is-invalid': entityForm.get('entityName')?.invalid && entityForm.get('entityName')?.touched}">
          <div class="invalid-feedback" *ngIf="entityForm.get('entityName')?.invalid && entityForm.get('entityName')?.touched">
            Entity Name is required (max 150 chars).
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Jurisdiction (Country) <span class="text-danger">*</span></label>
          <select class="form-select" formControlName="countryId"
                  [ngClass]="{'is-invalid': entityForm.get('countryId')?.invalid && entityForm.get('countryId')?.touched}">
            <option value="" disabled>Select Jurisdiction</option>
            <option *ngFor="let c of countries" [value]="c.id">{{ c.name }}</option>
          </select>
          <div class="invalid-feedback" *ngIf="entityForm.get('countryId')?.invalid && entityForm.get('countryId')?.touched">
            Please specify the legal jurisdiction.
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Operational Remarks</label>
          <textarea class="form-control" formControlName="description" rows="3" placeholder="Additional details about the entity's operational scope..."></textarea>
        </div>

        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="cancel()">Cancel</button>
          <button type="submit" class="btn-primary" [disabled]="entityForm.invalid">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 0.25rem;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Save Entity Configuration
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
