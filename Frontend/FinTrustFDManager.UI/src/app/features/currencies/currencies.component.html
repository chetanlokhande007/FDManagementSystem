<div class="page-container">

  <div class="page-header">

    <div>
      <h2>Currencies</h2>
      <p>Manage currencies</p>
    </div>

    <button class="add-btn" (click)="addCurrency()">
      + Add Currency
    </button>

  </div>


  <div class="table-card">

    <table>

      <thead>
        <tr>
          <th>ID</th>
          <th>Currency Name</th>
          <th>Currency Code</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody>

        <!-- Loading -->
        <tr *ngIf="loading">
          <td colspan="5" class="no-data">
            Loading currencies...
          </td>
        </tr>


        <!-- Backend data -->
        <tr *ngFor="let item of currencies; let i = index">

          <td>
            {{ i + 1 }}
          </td>

          <td>
            {{ item.currencyName }}
          </td>

          <td>
            {{ item.currencyCode }}
          </td>

          <td>

            <span class="status" [class.active]="item.isActive" [class.inactive]="!item.isActive">

              {{ item.isActive ? 'Active' : 'Inactive' }}

            </span>

          </td>

          <td class="actions">

            <button class="edit-btn" (click)="editCurrency(item)">
              Edit
            </button>

            <button class="delete-btn" (click)="deleteCurrency(item.currencyId)">
              Delete
            </button>

          </td>

        </tr>


        <!-- No data -->
        <tr *ngIf="!loading && currencies.length === 0">

          <td colspan="5" class="no-data">

            No currencies found

          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>

<!-- Add/Edit form -->
<div class="form-overlay" *ngIf="showForm">

  <div class="form-card">

    <div class="form-header">

      <h3>
        {{ isEdit ? 'Edit Currency' : 'Add Currency' }}
      </h3>

      <button class="close-btn" (click)="closeForm()">
        ×
      </button>

    </div>

    <div *ngIf="errorMessage" style="padding: 0 24px; color: #dc2626; font-size: 13px; font-weight: 500; margin-bottom: -10px;">
      {{ errorMessage }}
    </div>


    <div class="form-body">

      <div class="form-group">

        <label>
          Currency Name *
        </label>

        <input type="text" name="currencyName" [(ngModel)]="currency.currencyName" placeholder="Enter currency name">

      </div>


      <div class="form-group">

        <label>
          Currency Code *
        </label>

        <input type="text" name="currencyCode" [(ngModel)]="currency.currencyCode" maxlength="10"
          placeholder="Enter currency code">

      </div>

      <div class="form-group">

        <label>
          Status
        </label>

        <select name="isActive" [ngModel]="currency.isActive ? 'Active' : 'Inactive'"
          (ngModelChange)="currency.isActive = ($event === 'Active')">

          <option value="Active">
            Active
          </option>

          <option value="Inactive">
            Inactive
          </option>

        </select>

      </div>

    </div>


    <div class="form-footer">

      <button class="cancel-btn" (click)="closeForm()">

        Cancel

      </button>

      <button class="save-btn" (click)="saveCurrency()">

        {{ isEdit ? 'Update' : 'Save' }}

      </button>

    </div>

  </div>

</div>
